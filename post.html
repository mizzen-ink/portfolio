<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 马壮壮</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .post-page { padding-top: 100px; }
        .post-container { max-width: 800px; margin: 0 auto; padding: 0 24px; }
        .post-header { margin-bottom: 40px; padding-top: 40px; }
        .post-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; margin-bottom: 24px; transition: var(--transition); }
        .post-back:hover { color: var(--accent); }
        .post-title { font-size: 2.2rem; font-weight: 800; line-height: 1.3; margin-bottom: 16px; }
        .post-meta { display: flex; align-items: center; gap: 16px; color: var(--text-muted); font-size: 0.85rem; font-family: var(--font-mono); flex-wrap: wrap; }
        .post-meta .date { color: var(--text-muted); }
        .post-tags { display: flex; gap: 8px; }
        .post-tag { font-size: 0.75rem; color: var(--accent); background: rgba(124, 106, 255, 0.1); border: 1px solid rgba(124, 106, 255, 0.2); padding: 4px 12px; border-radius: 50px; }
        .post-content { padding-bottom: 60px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; padding-bottom: 60px; }
        .post-nav { display: flex; gap: 16px; }
        .post-body { line-height: 1.9; font-size: 1.05rem; color: var(--text-secondary); }
        .post-body h1, .post-body h2, .post-body h3 { color: var(--text-primary); margin: 1.5em 0 0.8em; }
        .post-body h1 { font-size: 1.8rem; }
        .post-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .post-body h3 { font-size: 1.2rem; }
        .post-body p { margin-bottom: 1.2em; }
        .post-body strong { color: var(--text-primary); }
        .post-body code { background: rgba(124, 106, 255, 0.1); color: var(--accent-light); padding: 2px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9em; }
        .post-body pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow-x: auto; margin: 1.5em 0; }
        .post-body pre code { background: none; padding: 0; color: var(--text-primary); font-size: 0.88rem; line-height: 1.7; }
        .post-body ul, .post-body ol { padding-left: 24px; margin: 1em 0; }
        .post-body li { margin-bottom: 6px; }
        .post-body blockquote { border-left: 3px solid var(--accent); padding: 12px 20px; margin: 1.5em 0; background: rgba(124, 106, 255, 0.05); border-radius: 0 8px 8px 0; color: var(--text-secondary); }
        .post-body a { color: var(--accent); text-decoration: underline; }
        .post-body img { max-width: 100%; border-radius: 12px; margin: 1.5em 0; }
        .post-body table { width: 100%; border-collapse: collapse; margin: 1.5em 0; }
        .post-body th, .post-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .post-body th { background: var(--bg-card); color: var(--text-primary); font-weight: 600; }
        .post-body td { color: var(--text-secondary); }
        .post-body hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

        .post-loading { text-align: center; padding: 120px 0; }
        .post-loading i { font-size: 2rem; color: var(--accent); margin-bottom: 16px; }
        .post-loading p { color: var(--text-muted); }

        @media (max-width: 768px) {
            .post-title { font-size: 1.6rem; }
            .post-footer { flex-direction: column; gap: 16px; text-align: center; }
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">&lt;<span>MZ</span>/&gt;</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">// home</a></li>
                <li><a href="blog.html" class="nav-link active">// blog</a></li>
            </ul>
            <div class="nav-toggle"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="post-page">
        <div class="post-container">
            <div id="post-loading" class="post-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>加载文章中...</p>
            </div>
            <article id="post-article" style="display:none;">
                <div class="post-header">
                    <a href="blog.html" class="post-back"><i class="fas fa-arrow-left"></i> Back to Blog</a>
                    <h1 id="post-title" class="post-title"></h1>
                    <div class="post-meta">
                        <span class="date" id="post-date"></span>
                        <div class="post-tags" id="post-tags"></div>
                    </div>
                </div>
                <div id="post-body" class="post-content post-body"></div>
                <div class="post-footer">
                    <a href="blog.html" class="post-back"><i class="fas fa-arrow-left"></i> Back to Blog</a>
                    <a href="editor/" class="btn btn-outline btn-small"><i class="fas fa-pen"></i> 写新文章</a>
                </div>
            </article>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">&lt;<span>MZ</span>/&gt;</div>
            <p class="footer-text">Designed & Built by 马壮壮</p>
            <div class="footer-socials">
                <a href="https://github.com/mizzen-ink" target="_blank"><i class="fab fa-github"></i></a>
                <a href="mailto:2716065616@qq.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
        // ====================================
        // 文章详情页
        // ====================================
        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('file');
            const loadingEl = document.getElementById('post-loading');
            const articleEl = document.getElementById('post-article');

            if (!filename) {
                loadingEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i><p>未指定文章</p>';
                return;
            }

            try {
                const res = await fetch(`https://api.github.com/repos/mizzen-ink/portfolio/contents/posts/${filename}`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!res.ok) throw new Error('文章不存在');

                const data = await res.json();
                const content = decodeURIComponent(escape(atob(data.content)));

                // 解析 frontmatter
                let title = filename.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '');
                let tags = [];
                let date = '';
                let body = content;

                const fmMatch = content.match(/^---\n([\s\S]*?)\n---\n/);
                if (fmMatch) {
                    const fm = fmMatch[1];
                    const tMatch = fm.match(/title:\s*"(.+?)"/);
                    if (tMatch) title = tMatch[1];
                    const dMatch = fm.match(/date:\s*([\d-]+)/);
                    if (dMatch) date = dMatch[1];
                    const tagsMatch = fm.match(/tags:\s*\[([\s\S]*?)\]/);
                    if (tagsMatch) {
                        tags = tagsMatch[1].split(',').map(t => t.trim().replace(/"/g, '')).filter(Boolean);
                    }
                    body = content.slice(fmMatch[0].length);
                }

                // 渲染
                document.title = `${title} | 马壮壮`;
                document.getElementById('post-title').textContent = title;
                document.getElementById('post-date').textContent = date;
                document.getElementById('post-tags').innerHTML = tags.map(t =>
                    `<span class="post-tag">${t}</span>`
                ).join('');
                document.getElementById('post-body').innerHTML = marked.parse(body, { breaks: true });

                loadingEl.style.display = 'none';
                articleEl.style.display = 'block';

            } catch (err) {
                loadingEl.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${err.message}</p>
                    <a href="blog.html" class="btn btn-outline" style="margin-top:20px;">返回博客</a>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
