<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 | 马壮壮</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">&lt;<span>MZ</span>/&gt;</a>
            <ul class="nav-menu">
                <li><a href="../blog.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back</a></li>
                <li><a href="#" class="nav-link" onclick="event.preventDefault();showTokenSetup()"><i class="fas fa-cog"></i> Token</a></li>
            </ul>
            <div class="nav-toggle"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <div class="editor-page">
        <div class="editor-container">
            <div class="editor-sidebar">
                <div class="editor-meta">
                    <input type="text" id="post-title" placeholder="文章标题..." class="editor-input editor-title">
                    <input type="text" id="post-tags" placeholder="标签 (逗号分隔) e.g. C++, Linux" class="editor-input editor-tags">
                    <input type="text" id="post-desc" placeholder="文章简介 (可选)" class="editor-input editor-desc">
                    <div class="editor-toolbar">
                        <button class="editor-tool" onclick="insertMarkdown('**', '**')" title="Bold"><i class="fas fa-bold"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('*', '*')" title="Italic"><i class="fas fa-italic"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('`', '`')" title="Code"><i class="fas fa-code"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('```\n', '\n```')" title="Code Block"><i class="fas fa-terminal"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('[', '](url)')" title="Link"><i class="fas fa-link"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('![', '](url)')" title="Image"><i class="fas fa-image"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('- ', '')" title="List"><i class="fas fa-list"></i></button>
                        <button class="editor-tool" onclick="insertMarkdown('# ', '')" title="Heading"><i class="fas fa-heading"></i></button>
                    </div>
                    <div class="editor-status">
                        <span id="word-count">0 字</span>
                        <button class="btn btn-primary btn-small" onclick="publishPost()">
                            <i class="fas fa-cloud-upload-alt"></i> 发布文章
                        </button>
                    </div>
                </div>
            </div>
            <div class="editor-main">
                <div class="editor-panes">
                    <div class="editor-pane">
                        <div class="pane-header">Markdown</div>
                        <textarea id="markdown-editor" placeholder="在这里写文章...支持 Markdown 语法

---

## 示例

```cpp
#include <iostream>
int main() {
    std::cout << \"Hello, World!\" << std::endl;
    return 0;
}
```"></textarea>
                    </div>
                    <div class="editor-pane">
                        <div class="pane-header">Preview</div>
                        <div id="preview" class="preview-content markdown-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="publish-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-check-circle"></i></div>
            <h3>发布成功！</h3>
            <p id="publish-msg">文章已保存到 GitHub</p>
            <div class="modal-actions">
                <a href="../blog.html" class="btn btn-primary">查看博客</a>
                <button class="btn btn-outline" onclick="closeModal()">继续编辑</button>
            </div>
        </div>
    </div>

    <!-- Token 设置弹窗 -->
    <div id="token-modal" class="modal">
        <div class="modal-content" style="text-align:left;">
            <h3 style="margin-bottom:16px;"><i class="fas fa-key" style="color:var(--accent);"></i> 设置 GitHub Token</h3>
            <p style="color:var(--text-secondary);margin-bottom:16px;font-size:0.9rem;">需要 Token 才能将文章保存到 GitHub 仓库。</p>
            <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="editor-input" style="margin-bottom:16px;">
            <p style="color:var(--text-muted);font-size:0.78rem;margin-bottom:16px;">
                <i class="fas fa-info-circle"></i>
                Token 仅保存在浏览器本地，不会上传到其他服务器。
                <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent);">去生成 Token →</a>
            </p>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveTokenFromModal()">保存</button>
                <button class="btn btn-outline" onclick="document.getElementById('token-modal').classList.remove('active')">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="editor.js"></script>
</body>
</html>
